course:
  id: ue-phil-arg-2026-ws
  title: "Übung Philosophisches Argumentieren"
  semester: "WS 26/27"
  language: "de"
  ects: 6
  date_format: "%d.%m.%Y" # optional display format for template-rendered dates

  instructors:
    - name: "Sebastian Cacean"
      email: "sebastian.cacean@hhu.de"
      role: "lecturer"          # lecturer | tutor | coordinator

  organization:
    institution: "Heinrich-Heine-Universität Düsseldorf"
    department: "Institut für Philosophie"
    institute: "Institut für Philosophie"

  defaults:
    status: published      # planned | draft | review | published | archived
    visibility: public     # public | hidden
    duration: 90           # minutes


  schedule:
    start_date: 2026-10-15
    end_date: 2027-02-04
    weekly_day: "Friday"

# Course-level artifacts (e.g. syllabus, a course overview deck)
artifacts:
  - id: syllabus
    type: syllabus
    file: "content/syllabus.qmd"

modules:
  - id: sitzung-01
    type: lecture
    title: "Sitzung 1"
    subtitle: "Kursüberblick & Einfache Argumentkarten"
    description: >
      In dieser einführenden Sitzung werden organisatorische Informationen geteilt und Fragen dazu geklärt. 
      Außerdem analysieren wir die Argumentation eines erstes Textbeispiels und machen uns die Ziele der Argumentanalyse klar.
    date: 2026-10-16
    # visibility: hidden
    # overwrite: never

    learning_objectives: |
      + Was sind die Ziele der Argumentanalyse?
      + Woran erkennt man Argumente?
      + Wie kann man mit einfachen Argumentkarten Beziehungen zwischen Argumente darstellen?
    artifacts:
      - id: folien-sitzung-01
        type: slides
        output_formats: [revealjs, pdf]
        # status: draft
        # visibility: hidden
        overwrite: never
      - id: notes-01
        type: notes
        # status: draft
        # visibility: hidden
        overwrite: never
        output_formats: [website, pdf]
      - id: assignment-01
        type: assignment
        # status: draft
        # visibility: hidden
        # overwrite: never
        output_formats: [website]


  - id: sitzung-02
    type: lecture
    title: "Sitzung 2"
    subtitle: "Struktur von Argumenten"
    description: >
      In dieser Sitzung werden grundlegende Ideen zum Argumentbegriff eingeführt und wiederholt.
    date: 2026-10-23
    # visibility: public

    learning_objectives: |
      + Was ist ein Argument und wie sind Argumente aufgebaut?
      + Was ist die (einfache) Standarddarstellung eines Arguments? Wie funktionieren mehrstufige Argumente?
      + Inwiefern können die Prämissen eines Arguments die Konklusion begründen? Was ist deduktive Gültigkeit?

    artifacts:
      - id: folien-sitzung-02
        type: slides
        # visibility: hidden
        status: draft
        output_formats: [revealjs, pdf]
      - id: notes-02
        type: notes
        # status: draft
        # visibility: hidden
        # overwrite: never
        output_formats: [website, pdf]
      - id: assignment-02
        type: assignment
        status: draft
        visibility: hidden
        output_formats: [website]


  - id: sitzung-03
    type: lecture
    title: "Sitzung 3"
    subtitle: "Formal-logische Gültigkeit und aussagenlogische Formalisierung"
    description: >
      In dieser Sitzung beschäftigen wir uns mit der logisch-semantischen Analyse (Formalisierung) von natürlichsprachlichen Sätzen und ihrer Rolle für die Prüfung deduktiver Gültigkeit von Argumenten.
    date: 2026-10-30
    # status: published
    # visibility: hidden

    learning_objectives: |
      + Welche Rolle spielt die Formalisierung für den Gültigkeitsnachweis von Argumenten?
      + Was sind die Satzoperatoren der formalen Logik?
      + Adäquatheitsbedingungen der Formalisierung: Wie können und müssen Aussagen formalisiert werden?
    artifacts:
      - id: folien-sitzung-03
        type: slides
        status: published
        output_formats: [revealjs, pdf]
      - id: notes-03
        type: notes
        # visibility: hidden
        output_formats: [website, pdf]
      - id: assignment-03
        type: assignment
        # status: published
        # visibility: hidden
        output_formats: [website, pdf]

