# Hand-editable Quarto project config.
# Generated once by tools/generate.py — will NOT be overwritten on subsequent runs.
# Navigation and format are imported from generator-owned metadata files.

project:
  type: website
  output-dir: docs
  render:
  - "index.qmd"
  - "content/**"
  - "!content/slides/**"
  # TODO: Make this dependent on infos from course.yaml
lang: de
reference-section-title: "Literatur"

# Import generated metadata files — do not edit these by hand.
metadata-files:
  - _quarto-nav.yml
  - _quarto-format.yml

website:
  title: "Übung Philosophisches Argumentieren"
  favicon: ""

  navbar:
    background: primary
    search: true

  sidebar: false

  page-footer:
    left: "WS 26/27 · Heinrich-Heine-Universität Düsseldorf"
    right: |
      Built with [Quarto](https://quarto.org)

execute:
  freeze: auto
